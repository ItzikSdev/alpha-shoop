# LiteLLM Proxy — Alpha Shoop
#
# Start: make proxy
# URL:   http://localhost:4000
# Docs:  http://localhost:4000/ui
#
# All agents call this proxy via the OpenAI-compatible API.
# Model aliases decouple agent code from specific Claude model IDs.
#
# TEMPORARY: both tiers run on the direct Anthropic API right now.
# Vertex AI (GCP project alpha-shoop, region us-east5) is set up, but
# alpha/worker-smart needs Claude Sonnet 4.5 enabled first at
# https://console.cloud.google.com/vertex-ai/publishers/anthropic/model-garden?project=alpha-shoop
# alpha/worker-fast stays on direct Anthropic permanently — Haiku isn't
# available in this project's Vertex AI Model Garden at all (403, not just
# un-enabled).
#
# alpha/director (Opus 4.8, "most capable" tier) was removed — it backed
# src/agents/director.py's LLM-routing calls only, and that file was deleted
# when the pipeline was consolidated into src/agents/orchestrator.py's plain
# Python control flow. No code calls get_llm("director") anymore.

model_list:
  # ── Worker smart: balanced cost/quality (E-com + Marketing + Store Setup) ─
  - model_name: alpha/worker-smart
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 8192 # design_agent generates large CSS payloads (was 4096 — caused truncation/hangs)

  # ── Director: most capable, deep reasoning — Sol the builder (Opus 4.8) ──
  - model_name: alpha/director
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 8192

  # ── Worker fast: cheapest, high volume (Scraper + Fulfillment) ───────────
  - model_name: alpha/worker-fast
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      max_tokens: 2048

  # ── Local fast: FREE local model for the agent "company" layer ───────────
  # Used by the org's frequent/cheap calls (standups, onboarding, training)
  # via get_llm("standup"). Runs through Ollama on the host — no API cost.
  # Setup: `brew install ollama` → `ollama serve` → `ollama pull qwen3:14b`.
  # If Ollama isn't running, the org's meeting code degrades safely (0
  # decisions), so this never crashes the autonomous loop.
  - model_name: alpha/local-fast
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://host.docker.internal:11434
      max_tokens: 4096
      num_ctx: 40960 # Must match alpha/local-coder below — both point at the same underlying
                      # `ollama_chat/qwen3:14b` process (Ollama runs one instance at a time), so
                      # a mismatched value here would reload the model at 32768 on every standup
                      # call and undo local-coder's context window for Sol until the next call.
      initial_status_system_prompt: "You must respond ONLY in English. Do not use Hebrew under any circumstances."

  # ── Local CODER: stronger local model for the Developer agent (Grace) / Sol ──
  # Sol (role "builder") runs on this as his PRIMARY model — see _ROLE_MODEL in
  # src/llm/client.py. qwen3:14b → qwen3.6:35b → qwen3.6:27b → back to qwen3:14b
  # (owner-tuned 2026-07-07; 27b/35b generated at only ~5-7 tok/s — too slow for
  # Sol's multi-step tool-calling loop; 14b trades some quality for real speed).
  - model_name: alpha/local-coder
    litellm_params:
      model: ollama_chat/qwen3:14b
      api_base: http://host.docker.internal:11434
      max_input_tokens: 8192
      max_tokens: 4096 # Raised to 8192 to allow Qwen3 to spit out full, long code scripts without truncation
      num_ctx: 40960 # Ollama's actual KV-cache context window. Raised from 32768 2026-08-16 to
                      # fix an 83% timeout rate on Sol's runs. 40960 is this GGUF's HARD CEILING
                      # (max_position_embeddings) — `ollama show qwen3:14b` reports "context
                      # length 40960"; requesting more (tried 65536, OpenClaw's stated >=64K
                      # minimum) gets silently clamped by Ollama to 40960. To truly reach 64K+,
                      # this model would need to be swapped for a build with RoPE/YaRN scaling —
                      # not done here, out of scope for this pass.
      initial_status_system_prompt: "You must respond ONLY in English. All explanations, comments, and code architecture must be written in English only, regardless of the input language."

litellm_settings:
  drop_params: true # ignore unsupported params (e.g. top_k) instead of erroring
  num_retries: 3 # retry transient Anthropic errors automatically
  request_timeout: 900 # seconds before a request is killed

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 900
  retry_after: 2 # seconds to wait before retry
  allowed_fails: 3 # mark a model unhealthy after this many failures
  # When the Anthropic model fails (e.g. "credit balance too low", rate limit,
  # outage), fall back to the FREE local Ollama model so Sol + the pipeline keep
  # working with no API credits. Sol/builder + director use the stronger coder
  # model; the cheap tier uses local-fast.
  fallbacks:
    - alpha/worker-smart: ["alpha/local-coder"]
    - alpha/director: ["alpha/local-coder"]
    - alpha/worker-fast: ["alpha/local-fast"]
  # Also fall back on context-window and content errors rather than hard-failing.
  context_window_fallbacks:
    - alpha/worker-smart: ["alpha/local-coder"]
    - alpha/worker-fast: ["alpha/local-fast"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY # Bearer token agents must send
  store_model_in_db: false # disable LiteLLM's own DB (we use ours)
