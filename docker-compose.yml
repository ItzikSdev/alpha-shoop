services:

  # NOTE: PostgreSQL removed — the whole system now uses ONE shared SQLite DB
  # (data/traces.db): org agents, stores, traces AND product mappings live there,
  # so Linus, Grace and the dashboard all read/write the same place.

  # ── Redis Stack (RediSearch + vector similarity, for src/rag RAG corpora) ──
  redis:
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Ollama (local embeddings — nomic-embed-text) ─────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # ── FalkorDB (visual knowledge graph — agent/tool/event relations) ────────
  # Host ports remapped: 6379 is already taken by the redis-stack-server RAG
  # service above, and 3000/3001 are already taken by the docs service and a
  # locally-running Hydrogen dev server (node, [::1]:3001) respectively — the
  # latter isn't a compose service so nothing here would have caught the
  # collision; found by inspecting the actual response body, not just the
  # HTTP status code. The container's own internal ports (6379 for the
  # graph/Redis protocol, 3000 for the bundled Browser UI) are unchanged.
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    ports:
      - "6380:6379"
      - "3002:3000"
    environment:
      # The bundled Browser (NextAuth v5) infers its own login/callback URLs
      # from AUTH_URL (NEXTAUTH_URL is only a v4-compat fallback — this image
      # bakes AUTH_URL=http://localhost:3000/ into its own .env.local, which
      # otherwise wins). Must match the falkor-mirror port platform-app embeds
      # it through (vite.config.ts `falkorMirror`, :3009) — NOT :3002 (raw
      # container port) or :3000 (collides with the unrelated `docs` service).
      AUTH_URL: http://localhost:3009
      NEXTAUTH_URL: http://localhost:3009
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LiteLLM Proxy ────────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-alpha-shoop-local}
      GOOGLE_APPLICATION_CREDENTIALS: /app/gcp-adc.json
      GOOGLE_CLOUD_PROJECT: alpha-shoop
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ${HOME}/.config/gcloud/application_default_credentials.json:/app/gcp-adc.json:ro
    command: --config /app/config.yaml
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── FastAPI ───────────────────────────────────────────────────────────────
  api:
    image: alpha-shoop-api:prod
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # optional in CI where secrets come from GCP
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/traces.db
      REDIS_URL: redis://redis:6379/0
      LITELLM_PROXY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-alpha-shoop-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SHOPIFY_STORE_DOMAIN: ${SHOPIFY_STORE_DOMAIN:-}
      SHOPIFY_ACCESS_TOKEN: ${SHOPIFY_ACCESS_TOKEN:-}
      CJ_EMAIL: ${CJ_EMAIL:-}
      CJ_API_KEY: ${CJ_API_KEY:-}
      OLLAMA_URL: http://ollama:11434
      CHROMA_PATH: /app/data/chroma
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    volumes:
      - traces_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      ollama:
        condition: service_healthy
      falkordb:
        condition: service_healthy

  # ── React Docs (production build, nginx) ─────────────────────────────────
  docs:
    image: alpha-shoop-docs:prod
    build:
      context: ./platform-app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"

volumes:
  traces_data:
  ollama_data:
  falkordb_data:
